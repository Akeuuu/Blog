services:
  # Le service pour la base de données
  postgres:
    image: postgres:17
    container_name: postgres_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: asso_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d asso_db"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Le service pour ton code NestJS
  api:
    build: .
    container_name: nestjs_api
    ports:
      - "4040:4040"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - DATABASE_URL=postgresql://admin:admin@postgres:5432/asso_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data: